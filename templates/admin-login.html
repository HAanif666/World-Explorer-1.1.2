<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>World Explorer Admin</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='admin.css') }}"
    >

    <script
        src="{{ url_for('static', filename='admin-login.js') }}"
        defer
    ></script>

</head>

<body>

    <main class="login-container">

        <h1>🌍 World Explorer</h1>

        <h2>Admin Access</h2>

        <input
            id="adminCode"
            type="password"
            placeholder="Enter admin code"
        >

        <button id="loginButton">
            Enter Dashboard
        </button>

        <p id="message"></p>

    </main>

</body>

</html>
